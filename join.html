<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Game — Who Dunnit?</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link rel="stylesheet" href="join.css">
</head>
<body>

    <div class="card">
        <h1>Join a Game</h1>
        <span class="ornament">✦ ✦ ✦</span>

        <div style="position:relative; z-index:1;">
            <p style="font-family:'EB Garamond',serif; font-size:16px; font-style:italic; color:#5a3e28; margin-bottom:22px; letter-spacing:0.03em;">
                Enter your six-character room code below
            </p>

            <div class="code-container">
                <input type="text" class="code-box" maxlength="1">
                <input type="text" class="code-box" maxlength="1">
                <input type="text" class="code-box" maxlength="1">
                <input type="text" class="code-box" maxlength="1">
                <input type="text" class="code-box" maxlength="1">
                <input type="text" class="code-box" maxlength="1">
            </div>

            <button id="joinGameBtn">Join Game</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='join.js') }}"></script>
</body>
</html>
