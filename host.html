<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Host Game — Who Dunnit?</title>
    <link rel="stylesheet" href="host.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>

    <div class="card">
        <h1 class="title">Host Game</h1>
        <span class="ornament">✦ ✦ ✦</span>

        <div class="container">
            <div class="dropdown-box">
                <div>
                    <label for="playersSelect">No. of Players</label>
                    <select id="playersSelect">
                        <option value="">Select</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                    </select>
                </div>
                <div>
                    <label for="clueSelect">No. of Cluecards</label>
                    <select id="clueSelect">
                        <option value="">Select</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>
                </div>
            </div>

            <button id="makeGameBtn" class="btn">Make Game</button>

            <div id="errorBox" class="error-box">
                Select options to begin.
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="host.js"></script>
</body>
</html>
