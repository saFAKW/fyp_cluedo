<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waiting Room — Who Dunnit?</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link rel="stylesheet" href="wait.css">
</head>
<body>

    <div class="card">
        <h1>Waiting Room</h1>
        <span class="ornament">✦ ✦ ✦</span>

        <p class="room-code-label">Room Code</p>
        <div id="roomCodeDisplay" class="room-code">—</div>

        <h3 class="players-title">Players Joined</h3>

        <div class="players-box">
            <ul id="playerList">
                <div class="waiting-text">Waiting for players to join…</div>
            </ul>
        </div>

        <button id="startGameBtn" style="display:none;">Start Game</button>
    </div>

    <script src="wait.js"></script>
</body>
</html>
