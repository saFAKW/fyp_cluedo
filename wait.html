<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waiting Room</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding-top: 50px;
            background-color: #f4f4f4;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 600px;
        }

        h1 {
            color: #333;
        }

        .room-code {
            font-size: 32px;
            font-weight: bold;
            color: #007bff;
            margin: 20px 0;
            letter-spacing: 5px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 20px;
            border-top: 1px solid #eee;
        }

        li {
            padding: 10px;
            border-bottom: 1px solid #eee;
            font-size: 18px;
        }

        li:nth-child(even) {
            background-color: #fafafa;
        }

        #startGameBtn {
            margin-top: 30px;
            padding: 15px 30px;
            font-size: 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: none;
        }

        #startGameBtn:hover {
            background-color: #218838;
        }

        .waiting-text {
            color: #888;
            font-style: italic;
            margin-top: 20px;
        }

        /* USERNAME PROMPT OVERLAY */
        #usernamePrompt {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .prompt-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
        }

        .prompt-box h2 {
            margin-top: 0;
            color: #333;
        }

        .prompt-box input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 5px;
            margin: 15px 0;
            box-sizing: border-box;
        }

        .prompt-box input:focus {
            outline: none;
            border-color: #007bff;
        }

        .prompt-box button {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        .prompt-box button:hover {
            background-color: #0056b3;
        }

        #usernameError {
            color: #dc3545;
            min-height: 20px;
            font-size: 14px;
            margin: 10px 0;
        }
    </style>
</head>

<body>
    <div id="usernamePrompt" style="display: none;">
        <div class="prompt-box">
            <h2>Enter Your Detective Name</h2>
            <p>Room Code: <span id="roomCodePreview" style="color: #007bff; font-weight: bold;">...</span></p>
            <input type="text" id="usernameInput" placeholder="Your detective name" maxlength="20" autocomplete="off" />
            <div id="usernameError"></div>
            <button id="joinWithNameBtn">Join Game</button>
        </div>
    </div>

    <div class="container" id="waitingRoom" style="display: none;">
        <h1>Host Game</h1>

        <div>Room Code:</div>
        <div id="roomCodeDisplay" class="room-code">Loading...</div>
        <h3>Names of Players Joined</h3>

        <ul id="playerList">
            <div class="waiting-text">Waiting for players to join...</div>
        </ul>
        <button id="startGameBtn">Start Game</button>
    </div>
    <script src="wait.js"></script>
</body>

</html>
