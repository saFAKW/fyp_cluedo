<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waiting Room — Who Dunnit?</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background-color: #f4f4f4; }
        .container { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 80%; max-width: 600px;}
        h1 { color: #333; }
        .room-code { font-size: 32px; font-weight: bold; color: #007bff; margin: 20px 0; letter-spacing: 5px; }
        ul { list-style: none; padding: 0; margin-top: 20px; border-top: 1px solid #eee; }
        li { padding: 10px; border-bottom: 1px solid #eee; font-size: 18px; }
        li:nth-child(even) { background-color: #fafafa; }
        #startGameBtn { 
            margin-top: 30px; padding: 15px 30px; font-size: 20px; 
            background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; display: none; 
        }
        #startGameBtn:hover { background-color: #218838; }
        .waiting-text { color: #888; font-style: italic; margin-top: 20px; }
    </style>
</head>

<body>

    <div class="container">
        <h1>Host Game</h1>
        
        <div>Room Code:</div>
        <div id="roomCodeDisplay" class="room-code">Loading...</div>

        <h3>Names of Players Joined</h3>
        
        <ul id="playerList">
            <div class="waiting-text">Waiting for players to join...</div>
        </ul>

        <button id="startGameBtn">Start Game</button>
    </div>
    <script src="wait.js"></script>
</body>

</html>
