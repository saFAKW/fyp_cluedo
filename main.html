<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhoDunnit</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="board.css">
</head>
<body style="position: relative; overflow: hidden; background: #d9d9d9; margin: 0; min-height: 100vh;">
    
    <div style="display: flex; justify-content: center; align-items: center; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1;">
        <svg id="board" style="box-shadow: 0px 4px 15px rgba(0,0,0,0.3);"></svg>
    </div>

    <div style="position: relative; z-index: 10;">
        <div class="tab-left" onclick="togglePanel('left')">INBOX</div>
        <div class="tab-right" onclick="togglePanel('right')">FINDINGS</div>
        <div class="tab-bottom" onclick="togglePanel('bottom')">CARDS</div>

        <div class="panel-left" id="panelLeft">
            <div class="panel-header">Inbox</div>
            <div class="panel-content" id="inboxContent">
            </div>
        </div>

        <div class="modal-overlay" id="replyModal">
            <div class="modal-content">
                <div class="modal-header" id="replyModalTitle">Reply</div>
                <div class="modal-body">
                    <p style="margin-bottom:14px; font-size:14px;">Choose a card from your hand to send, or send no card:</p >
                    <div id="replyCardsContainer" style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px;"></div>
                </div>
                <div class="modal-buttons">
                    <button class="modal-button" onclick="closeReplyModal()">Cancel</button>
                    <button class="modal-button primary" id="sendReplyBtn" onclick="sendReply()">Send</button>
                </div>
            </div>
        </div>

        <div class="modal-overlay" id="letterModal">
            <div class="modal-content">
                <div class="modal-header" id="modalTitle">Letter</div>
                <div class="modal-body" id="modalBody">
                </div>
                <div class="modal-buttons">
                    <button class="modal-button" onclick="closeLetterModal()">Close</button>
                    <button class="modal-button primary" onclick="replyToLetter()">Reply</button>
                </div>
            </div>
        </div>

        <div class="send-letter-btn" onclick="openSendLetterModal()" style="position: absolute; top: 20px; right: 20px; z-index: 100; background: white; padding: 10px 15px; border-radius: 8px; border: 2px solid #333; cursor: pointer; box-shadow: 2px 2px 8px rgba(0,0,0,0.3); font-weight: bold;">
            <span>✉ Send Letter</span>
        </div>

        <div class="modal-overlay" id="sendLetterModal">
            <div class="modal-content">
                <div class="modal-header">Send a Letter</div>
                <div class="modal-body">
                    <div class="send-field">
                        <label for="selectSuspect">Suspect</label>
                        <select id="selectSuspect" class="send-select">
                            <option value="">— Choose a suspect —</option>
                            <option>Miss Scarlet</option>
                            <option>Colonel Mustard</option>
                            <option>Reverend Green</option>
                            <option>Mrs. Peacock</option>
                            <option>Professor Plum</option>
                            <option>Dr. Orchid</option>
                        </select>
                    </div>
                    <div class="send-field">
                        <label for="selectWeapon">Weapon</label>
                        <select id="selectWeapon" class="send-select">
                            <option value="">— Choose a weapon —</option>
                            <option>Knife</option>
                            <option>Revolver</option>
                            <option>Rope</option>
                            <option>Lead Pipe</option>
                            <option>Wrench</option>
                            <option>Candlestick</option>
                        </select>
                    </div>
                    <div class="send-field">
                        <label for="selectRoom">Room</label>
                        <select id="selectRoom" class="send-select">
                            <option value="">— Choose a room —</option>
                            <option>Kitchen</option>
                            <option>Ballroom</option>
                            <option>Conservatory</option>
                            <option>Dining Room</option>
                            <option>Lounge</option>
                            <option>Hall</option>
                            <option>Study</option>
                            <option>Library</option>
                            <option>Billiard Room</option>
                        </select>
                    </div>
                    <p id="sendLetterError" style="color:red; font-size:13px; min-height:18px; margin-top:4px;"></p >
                </div>
                <div class="modal-buttons">
                    <button class="modal-button" onclick="closeSendLetterModal()">Cancel</button>
                    <button class="modal-button primary" onclick="submitSendLetter()">Send</button>
                </div>
            </div>
        </div>

        <div class="panel-right" id="panelRight">
            <div class="panel-header">Findings</div>
            <div class="panel-content" id="findingsContent">
            </div>
        </div>

        <div class="panel-bottom" id="panelBottom">
            <div class="panel-header">Cards</div>
            <div class="panel-content">
                <div class="cards-container" id="cardsContent">
                </div>
            </div>
        </div>
    </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
<script src="board.js"></script>
<script src="main.js"></script>
</body>
</html>
